name: Daily QA Job Hunter & WhatsApp Alert

on:
  schedule:
    # Runs at 03:30 UTC = 09:00 AM IST every day
    - cron: '30 3 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Job Hunter & Send WhatsApp Alert
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
        run: |
          python daily_job_hunter.py
